name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './scripts'
        severity: warning
    
    - name: Run ShellCheck on tests
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './tests'
        severity: warning
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        pip install flake8 black isort mypy
    
    - name: Lint Python code
      run: |
        flake8 src/ --max-line-length=100 --ignore=E203,W503
    
    - name: Check Python formatting
      run: |
        black --check src/
    
    - name: Type check Python
      run: |
        mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run smoke tests
      run: |
        bash tests/smoke-test.sh
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python test dependencies
      run: |
        pip install pytest pytest-asyncio pytest-cov aiohttp pyyaml
    
    - name: Run Python unit tests
      run: |
        cd src && python -m pytest ../tests/unit/ -v --cov=proxmox_dr --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pytest pytest-asyncio pyyaml
    
    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Debian package
      run: |
        sudo apt-get update
        sudo apt-get install -y debhelper devscripts
        cd debian && debuild -us -uc -b
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package
        path: ../*.deb

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t proxmox-dr:test -f docker/Dockerfile .
    
    - name: Test Docker image
      run: |
        docker run --rm proxmox-dr:test --version
